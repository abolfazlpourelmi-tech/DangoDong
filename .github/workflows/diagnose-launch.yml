name: Diagnose launch crash

# Throwaway diagnostic: launches the app on an emulator with and without the
# manifest hardening and captures logcat, so the cause of a crash is read off a
# stack trace instead of guessed at. Builds every ABI because the release APK
# ships arm only and the runners are x86_64.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harden: [true, false]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm exec expo prebuild --platform android --non-interactive

      - name: Apply the manifest hardening
        if: matrix.harden
        run: python3 scripts/harden-release-manifest.py

      - name: Build release APK
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew assembleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on an emulator and capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r -t android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.dong.mobile/.MainActivity
            sleep 25
            echo "===== is the process alive? ====="
            adb shell pidof com.dong.mobile || echo "PROCESS IS NOT RUNNING"
            echo "===== crash buffer ====="
            adb logcat -d -b crash
            echo "===== app + runtime log ====="
            adb logcat -d | grep -iE "com\.dong\.mobile|AndroidRuntime|ReactNative|Tapsell|cleartext|NetworkSecurity|FATAL" | tail -200

      - name: Name the log after the variant
        if: always()
        run: echo "harden=${{ matrix.harden }}"

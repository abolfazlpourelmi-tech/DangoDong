name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          echo "value=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v${{ steps.app_version.outputs.value }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm exec expo prebuild --platform android --non-interactive

      - name: Close the findings a store scan reports
        run: python3 scripts/harden-release-manifest.py

      - name: Keep only the architectures real phones use
        # The universal APK carried four: 48 MB of native libraries, of which a
        # handset loads exactly one. x86 and x86_64 are emulator targets. Setting
        # this on defaultConfig drops them at packaging time; arm64-v8a covers
        # anything modern and armeabi-v7a the older 32-bit phones.
        run: |
          python3 - <<'EOF'
          import io, re
          path = 'android/app/build.gradle'
          source = io.open(path, encoding='utf-8').read()
          assert 'abiFilters' not in source, 'already filtered'
          marker = 'defaultConfig {'
          index = source.index(marker) + len(marker)
          source = source[:index] + "\n        ndk {\n            abiFilters 'armeabi-v7a', 'arm64-v8a'\n        }" + source[index:]
          io.open(path, 'w', encoding='utf-8').write(source)
          print('abiFilters applied')
          EOF

      - name: Build release APK
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew assembleRelease

      - name: Prepare signing key
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/dangodong-release.jks"

      - name: Align and sign release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/dangodong-release.jks
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION: ${{ steps.app_version.outputs.value }}
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          UNSIGNED_APK=android/app/build/outputs/apk/release/app-release.apk
          ALIGNED_APK="$RUNNER_TEMP/dangodong-aligned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/dangodong-v${APP_VERSION}.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE_PATH" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out "$SIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: dangodong-v${{ steps.app_version.outputs.value }}-apk
          path: android/app/build/outputs/apk/release/dangodong-v${{ steps.app_version.outputs.value }}.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.app_version.outputs.value }}
        run: |
          APK="android/app/build/outputs/apk/release/dangodong-v${APP_VERSION}.apk"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --repo "$GITHUB_REPOSITORY" --verify-tag --title "دنگودونگ $GITHUB_REF_NAME" --generate-notes
          fi
